<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile - AI Smart Farming</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(to right, #1b5e20, #66bb6a);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 24px;
    }

    .card {
      width: 350px;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 15px;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.35);
    }

    h2 {
      margin-bottom: 5px;
    }

    p {
      margin-bottom: 15px;
      color: #e0f2f1;
      word-break: break-word;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 25px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout {
      background: #e53935;
      color: white;
    }

    .dashboard {
      background: #0b6623;
      color: white;
    }
  </style>
</head>
<body>

<div class="card">
  <img id="profilePic" src="" alt="User">
  <h2 id="name">User Name</h2>
  <p id="email">user@email.com</p>

  <button class="btn dashboard" onclick="goDashboard()">Go to Home</button>
  <button class="btn logout" onclick="logout()">Logout</button>
</div>

<script>
const token = localStorage.getItem("token");
let user = {};

try {
  user = JSON.parse(localStorage.getItem("user")) || {};
} catch (error) {
  user = {};
}

if (!token) {
  alert("Please login first");
  window.location.href = "SignIn.html";
}

const profileName = user.name || user.displayName || "Smart Farmer";
const profileEmail = user.email || "Signed in user";
const profileImage = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(profileName)}&background=1b5e20&color=ffffff`;

document.getElementById("name").innerText = profileName;
document.getElementById("email").innerText = profileEmail;
document.getElementById("profilePic").src = profileImage;

function goDashboard() {
  window.location.href = "index.html";
}

function logout() {
  localStorage.removeItem("token");
  localStorage.removeItem("user");
  window.location.href = "SignIn.html";
}
</script>

</body>
</html>
