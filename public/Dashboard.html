<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - AI Smart Farming</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial;
    }

    body {
      background: #f1f8e9;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2e7d32;
      color: white;
      padding: 15px 30px;
    }

    .logout {
      background: #fff;
      color: #2e7d32;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
    }

    .container {
      padding: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .card h3 {
      margin-bottom: 10px;
      color: #2e7d32;
    }

    .btn {
      margin-top: 10px;
      padding: 10px;
      border: none;
      background: #2e7d32;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

<div class="navbar">
  <h2>AI Smart Farming Dashboard</h2>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">
  <div class="grid">
    <div class="card">
      <h3>Weather</h3>
      <p id="weather">Click to get weather</p>
      <button class="btn" onclick="getWeather()">Get Weather</button>
    </div>

    <div class="card">
      <h3>Crop Recommendation</h3>
      <input type="number" id="temp" placeholder="Temperature">
      <input type="number" id="humidity" placeholder="Humidity">
      <button class="btn" onclick="predictCrop()">Predict</button>
      <p id="cropResult"></p>
    </div>

    <div class="card">
      <h3>Disease Detection</h3>
      <input type="file" id="image">
      <button class="btn" onclick="detectDisease()">Upload</button>
      <p id="diseaseResult"></p>
    </div>

    <div class="card">
      <h3>Analytics</h3>
      <p>Farming data insights coming soon...</p>
    </div>
  </div>
</div>

<script>
if (!localStorage.getItem("token")) {
  alert("Please login first");
  window.location.href = "SignIn.html";
}

function logout() {
  localStorage.removeItem("token");
  window.location.href = "SignIn.html";
}

async function getWeather() {
  const apiKey = "YOUR_API_KEY";

  if (apiKey === "YOUR_API_KEY") {
    document.getElementById("weather").innerText =
      "Add an OpenWeather API key in Dashboard.html to enable live weather.";
    return;
  }

  const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=Delhi&appid=${apiKey}&units=metric`);
  const data = await res.json();

  document.getElementById("weather").innerText =
    `Temp: ${data.main.temp} C, ${data.weather[0].description}`;
}

async function predictCrop() {
  const temp = document.getElementById("temp").value;
  const humidity = document.getElementById("humidity").value;

  const res = await fetch("/api/predict", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ temperature: temp, humidity })
  });

  const data = await res.json();

  document.getElementById("cropResult").innerText =
    res.ok ? `Recommended Crop: ${data.crop}` : (data.message || "Unable to predict crop");
}

function detectDisease() {
  document.getElementById("diseaseResult").innerText =
    "No disease detected (demo)";
}
</script>

</body>
</html>
