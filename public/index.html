<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Smart Farmer Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <style>

* {
  transition: all 0.3s ease;
}
body {
  margin: 0;
  font-family: 'Segoe UI';
  position: relative;
  overflow-x: hidden;
}

/* 🌄 Background Image with Blur */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  background: url("wheat.avif") no-repeat center center/cover;

  filter: blur(3px);
  opacity: 0.6;
  z-index: -1;
}

/* Overlay for better readability */
body::after {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  background: rgba(0, 0, 0, 0.2);
  z-index: -1;
}

/* Header */
/* Header Layout */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #2e7d32;
  color: white;
  padding: 20px 50px;
}

/* Nav Links */
nav {
  display: flex;
  gap: 30px;
}

/* Anchor Styling */
nav a {
  text-decoration: none;
  color: white;
  font-weight: 500;
  transition: 0.3s;
}

/* Hover Effect */
nav a:hover {
  color: #c8e6c9;
}

/* Signup Button Style */
.signup {
  background: white;
  color: #2e7d32;
  padding: 5px 12px;
  border-radius: 8px;
}

/* Mobile Responsive */
@media(max-width: 768px) {
  nav {
    gap: 15px;
    font-size: 14px;
  }
}

/* Dashboard Grid */
.dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 20px;
}

/* Glass Cards */
.card {
  background: rgba(255, 255, 255, 0.9); /* almost solid */
  backdrop-filter: blur(5px);
  padding: 20px;
  border-radius: 15px;
}

/* Hover Effect */
.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 15px 30px rgba(0,0,0,0.2);
}

/* Buttons */
button {
  background: #43a047;
  color: white;
  border: none;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #2e7d32;
  transform: scale(1.05);
}

/* Inputs */
input {
  width: 100%;
  padding: 8px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

/* Analytics */
.analytics {
  padding: 20px;
}

/* Dark Mode */
.dark {
  background: #121212;
  color: white;
}

.dark .card {
  background: rgba(0,0,0,0.5);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #2e7d32;
  color: white;
  padding: 12px 20px;
  border-radius: 10px;
  animation: fadeInOut 3s;
}

@keyframes fadeInOut {
  0% {opacity: 0; transform: translateY(20px);}
  10% {opacity: 1;}
  90% {opacity: 1;}
  100% {opacity: 0; transform: translateY(20px);}
}
  </style>

  <!-- Icons -->
  <script src="https://kit.fontawesome.com/yourkit.js" crossorigin="anonymous"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- 🔝 HEADER -->
<header>
  <h1>🌾 AI Smart Farmer</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html" target="_self">About Us</a>
    <a href="faq.html" target="_self">FAQs</a>
    <a href="newlog.html" class="signup" target="_self">Login/Sign Up</a>
  </nav>

  <button id="themeToggle">🌙</button>
</header>

<!-- 🧩 DASHBOARD -->
<section class="dashboard">

  <!-- 📍 LOCATION -->
  <div class="card">
    <h3>📍 Farm Location</h3>
    <button onclick="detectLocation()">Detect Location</button>
  </div>

  <!-- 🌤 WEATHER -->
  <div class="card" id="weatherCard">
    <h3>🌤 Weather</h3>
    <input type="text" id="cityInput" placeholder="Enter City">
    <button onclick="checkWeather()">Check Weather</button>
  </div>

  <!-- 🤖 AI CROP -->
  <div class="card">
    <h3>🌱 AI Crop Recommendation</h3>
    <button onclick="getRecommendation()">Get Recommendation</button>
    <p id="result"></p>
  </div>

  <!-- 🧪 SOIL -->
  <div class="card">
    <h3>🧪 Soil Health Tips</h3>
    <button onclick="checkSoil()">Check Soil</button>
  </div>

  <!-- 📷 DISEASE DETECTION -->
  <div class="card">
    <h3>📷 Crop Disease Detection</h3>
    <input type="file" id="imageUpload">
    <button onclick="analyzeCrop()">Analyze</button>
  </div>

  <!-- ⚠️ ALERT -->
  <div class="card">
    <h3>⚠️ Weather Alert</h3>
    <button onclick="checkAlert()">Check Alert</button>
  </div>

</section>

<!-- 📊 ANALYTICS -->
<section class="analytics">
  <h2>📊 Farm Yield Analytics</h2>
  <canvas id="chart"></canvas>
</section>

<!-- 📜 FOOTER -->
<footer>
  <p>© 2026 AI Smart Farmer | Built with ❤️</p>
</footer>

<!-- JS -->
<script>

/* 📍 Detect Location */
function detectLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition((pos) => {
      alert("Latitude: " + pos.coords.latitude + 
            "\nLongitude: " + pos.coords.longitude);
    });
  } else {
    alert("Geolocation not supported");
  }
}

/* 🌦 Weather API */
async function checkWeather() {
  const city = document.getElementById("cityInput").value.trim();

  if (!city) {
    alert("Enter city");
    return;
  }

  const apiKey = "df2fd3979295d81967e54a820889b484"; // 👈 replace

  try {
    const res = await fetch(
      `https://api.openweathermap.org/data/2.5/weather?q=${city},IN&appid=${apiKey}&units=metric`
    );

    const data = await res.json();
    console.log(data); // 👈 check this in console

    if (data.cod !== 200) {
      alert(data.message); // shows real error
      return;
    }

    alert(`🌡 Temp: ${data.main.temp}°C\n🌥 ${data.weather[0].description}`);

  } catch (err) {
    console.log(err);
    alert("Error fetching weather");
  }
}

/* 🌱 Crop Recommendation */
function getRecommendation() {
  const crops = ["Rice", "Wheat", "Maize", "Sugarcane"];
  const random = crops[Math.floor(Math.random() * crops.length)];

  alert("Recommended Crop: " + random);
}

/* 🌿 Soil Health */
function checkSoil() {
  alert("Soil looks healthy ✅ (Demo)");
}

/* 🦠 Disease Detection */
function analyzeCrop() {
  const file = document.querySelector("input[type='file']").files[0];

  if (!file) {
    alert("Upload image first");
    return;
  }

  alert("Analyzing crop... (AI Demo)\nNo disease detected ✅");
}

/* ⚠️ Weather Alert */
function checkAlert() {
  alert("No alerts currently 🌤");
}

const toggleBtn = document.getElementById("themeToggle");

/* Load saved theme */
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
  toggleBtn.textContent = "☀️";
}

/* Toggle */
toggleBtn.onclick = () => {
  document.body.classList.toggle("dark");

  if (document.body.classList.contains("dark")) {
    localStorage.setItem("theme", "dark");
    toggleBtn.textContent = "☀️";
  } else {
    localStorage.setItem("theme", "light");
    toggleBtn.textContent = "🌙";
  }
};

</script>



</body>
</html>
