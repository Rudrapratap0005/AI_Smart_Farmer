<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  height: 100vh;
  background: radial-gradient(circle at center, #4c3208, #111);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
}

.container {
  width: 100%;
  text-align: center;
}

.profile-card {
  max-width: 700px;
  margin: auto;
}

.profile-img {
  width: 170px;
  height: 170px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 20px;
  border: 4px solid rgba(255,255,255,0.2);
}

h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

.location {
  font-size: 14px;
  letter-spacing: 2px;
  margin-bottom: 20px;
  opacity: 0.8;
}

.tags {
  font-size: 16px;
  margin-bottom: 30px;
  opacity: 0.9;
}

.tags i {
  margin-right: 8px;
}

.social-icons {
  display: flex;
  justify-content: center;
  gap: 20px;
}

.social-icons a {
  width: 50px;
  height: 50px;
  border: 1px solid #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  text-decoration: none;
  font-size: 18px;
  transition: 0.3s;
}

.social-icons a:hover {
  background: #fff;
  color: #000;
}
  </style>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
  <div class="profile-card">
    
    <img src="pc2.jpeg" alt="Profile" class="profile-img">

    <h1>Rudra Pratap Shukla</h1>
    <p class="location">JALANDHAR</p>

    <p class="tags">
      <i class="fa-solid fa-tag"></i>
      Front End Web Development
    </p>

    <div class="social-icons">
      <a href="#"><i class="fab fa-facebook-f"></i></a>
      <a href="https://www.instagram.com/rudra._.shukla/"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-linkedin-in"></i></a>
    </div>

  </div>
</div>

</body>
</html>
